<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规范查询 Web POC</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2328; --muted: #6b7280;
    --accent: #1a6fff; --border: #e3e6ea; --user: #e8f1ff; --asst: #ffffff;
    --err: #c0392b; --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; }
  .meta { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); padding: 6px 14px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; width: 100%;
    margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; flex-direction: column; max-width: 100%; }
  .msg.user { align-items: flex-end; }
  .bubble {
    border: 1px solid var(--border); background: var(--asst); border-radius: 10px;
    padding: 10px 14px; max-width: 86%; white-space: pre-wrap; word-break: break-word;
    line-height: 1.6; font-size: 14.5px;
  }
  .msg.user .bubble { background: var(--user); }
  .msg.assistant .bubble { white-space: normal; }  /* markdown 渲染,不再 pre-wrap */
  .md h1, .md h2, .md h3, .md h4 { margin: .6em 0 .3em; line-height: 1.4; }
  .md h1 { font-size: 1.15em; } .md h2 { font-size: 1.1em; } .md h3, .md h4 { font-size: 1.02em; }
  .md p { margin: .45em 0; }
  .md ul, .md ol { margin: .4em 0; padding-left: 1.5em; }
  .md li { margin: .15em 0; }
  .md code { background: #f0f1f3; padding: .1em .3em; border-radius: 4px; font-family: var(--mono); font-size: .92em; }
  .md pre { background: #f6f7f9; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: .6em 0; font-size: .95em; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: #f0f1f3; }
  .md blockquote { margin: .5em 0; padding-left: 1em; border-left: 3px solid var(--border); color: var(--muted); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: .8em 0; }
  .md a { color: var(--accent); }
  .msg .role { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .role .who { color: var(--muted); }
  .role .status { margin-left: 8px; color: var(--accent); }
  .copy-btn {
    font-size: 12px; padding: 2px 10px; border-radius: 5px; color: var(--muted);
    background: transparent; border: 1px solid var(--border); line-height: 1.5;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.copied { color: #2e7d32; border-color: #2e7d32; }
  .cursor { display: inline-block; animation: blink 1s steps(2) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .error-text { color: var(--err); }
  .notice { font-size: 12px; color: #b7791f; margin-top: 6px; }
  details.activity {
    margin-top: 6px; max-width: 86%; font-size: 12.5px; color: var(--muted);
  }
  details.activity summary { cursor: pointer; user-select: none; }
  details.activity ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; }
  details.activity li { margin: 2px 0; word-break: break-all; }
  footer {
    border-top: 1px solid var(--border); background: var(--card); padding: 12px 20px;
  }
  .input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
  textarea {
    flex: 1; font: inherit; font-size: 14.5px; resize: none; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border: none; padding: 0 22px; font-weight: 600; }
  #send:hover { opacity: .9; }
  .hint { max-width: 900px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>规范查询 · Web POC <span style="color:var(--muted);font-weight:400">(DSH Agent Runtime + guifan-chaxun skill)</span></h1>
  <div class="meta">
    <span id="health">运行时: 检测中…</span>
    <button id="reset" title="换一个会话 id,清空本页对话">新会话</button>
  </div>
</header>

<main id="chat"></main>

<footer>
  <form id="form" class="input-row">
    <textarea id="input" rows="2" placeholder="例如:JTG 5120-2021 对桥梁检查周期是怎么规定的?"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
  <div class="hint">Enter 发送,Shift+Enter 换行 · 回复流式输出 · 展开"活动日志"可看到 agent 调用 skill/工具的过程</div>
</footer>

<script src="/static/vendor/marked.min.js"></script>
<script>
(function () {
  'use strict';
  var chatEl = document.getElementById('chat');
  var formEl = document.getElementById('form');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var healthEl = document.getElementById('health');
  var resetBtn = document.getElementById('reset');

  var sessionId = localStorage.getItem('gfc_session_id');
  if (!sessionId) { sessionId = newSessionId(); }
  var busy = false;

  function newSessionId() {
    var id = (crypto.randomUUID ? crypto.randomUUID() : 's-' + Date.now() + '-' + Math.random().toString(16).slice(2));
    localStorage.setItem('gfc_session_id', id);
    return id;
  }

  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Markdown → HTML(带廉价消毒:去 script/iframe/事件属性/javascript:)
  function renderMd(text) {
    if (typeof marked === 'undefined') return escapeHtml(text || '');
    var html;
    try { html = marked.parse(text || '', { breaks: true }); }
    catch (e) { return escapeHtml(text || ''); }
    return html
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/javascript:/gi, '');
  }

  // 复制到剪贴板(支持 http 非安全上下文:fallback 到 execCommand)
  function copyToClipboard(text, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { btn.textContent = '复制失败'; }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function copyButton(getText) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.addEventListener('click', function () {
      copyToClipboard(getText() || '', btn);
    });
    return btn;
  }

  function appendUser(text) {
    var wrap = document.createElement('div');
    wrap.className = 'msg user';
    var role = document.createElement('div'); role.className = 'role';
    var who = document.createElement('span'); who.className = 'who'; who.textContent = '你';
    role.appendChild(who);
    role.appendChild(copyButton(function () { return text; }));
    var bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
    wrap.appendChild(role); wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    scrollBottom();
  }

  // 助手消息气泡:流式文本 + 可折叠活动日志
  function appendAssistant() {
    var wrap = document.createElement('div');
    wrap.className = 'msg assistant';

    var rawText = '';
    var role = document.createElement('div'); role.className = 'role';
    var who = document.createElement('span'); who.className = 'who';
    who.appendChild(document.createTextNode('规范查询 Agent'));
    var statusSpan = document.createElement('span'); statusSpan.className = 'status';
    who.appendChild(statusSpan);
    role.appendChild(who);
    role.appendChild(copyButton(function () { return rawText || textSpan.textContent; }));

    var bubble = document.createElement('div'); bubble.className = 'bubble';
    var textSpan = document.createElement('span'); textSpan.className = 'stream-text md';
    var cursor = document.createElement('span'); cursor.className = 'cursor'; cursor.textContent = '▍';
    bubble.appendChild(textSpan); bubble.appendChild(cursor);

    var details = document.createElement('details');
    details.className = 'activity';
    var summary = document.createElement('summary');
    var countSpan = document.createElement('span'); countSpan.className = 'count'; countSpan.textContent = '0';
    summary.appendChild(document.createTextNode('活动日志('));
    summary.appendChild(countSpan);
    summary.appendChild(document.createTextNode(')'));
    var list = document.createElement('ul');
    details.appendChild(summary); details.appendChild(list);

    wrap.appendChild(role); wrap.appendChild(bubble); wrap.appendChild(details);
    chatEl.appendChild(wrap);
    scrollBottom();

    var activityCount = 0;
    return {
      finished: false,
      setStatus: function (text) { statusSpan.textContent = text; },
      setText: function (text) {
        rawText = text;
        textSpan.innerHTML = renderMd(text);
        bubble.classList.remove('error-text');
        scrollBottom();
      },
      addActivity: function (type, summaryText) {
        activityCount += 1;
        countSpan.textContent = String(activityCount);
        var li = document.createElement('li');
        li.textContent = type + ': ' + summaryText;
        li.title = type + ': ' + summaryText;
        list.appendChild(li);
      },
      finish: function () { cursor.textContent = ''; statusSpan.textContent = ''; },
      addNotice: function (text) {
        var n = document.createElement('div');
        n.className = 'notice';
        n.textContent = text;
        bubble.appendChild(n);
      },
      showError: function (message) {
        cursor.textContent = '';
        statusSpan.textContent = '';
        textSpan.textContent = textSpan.textContent || '执行失败';
        var err = document.createElement('div');
        err.className = 'error-text';
        err.textContent = message;
        bubble.appendChild(err);
      }
    };
  }

  function handleFrame(frame, bubble, ctx) {
    var event = 'message', data = '';
    var lines = frame.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.indexOf('event:') === 0) event = line.slice(6).trim();
      else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
    }
    if (!data) return;
    var payload;
    try { payload = JSON.parse(data); } catch (e) { return; }
    switch (event) {
      case 'status':
        bubble.setStatus(payload.status === 'queued' ? '排队中…(前一问未完成,请稍候)'
          : payload.status === 'starting' ? '启动中…'
          : payload.status === 'running' ? 'Agent 思考中…' : '');
        break;
      case 'text':
        bubble.setText(payload.text || '');
        break;
      case 'activity':
        bubble.addActivity(payload.type || 'event', payload.summary || '');
        break;
      case 'done':
        bubble.setText(payload.final_response || '');
        bubble.finish();
        bubble.finished = true;
        break;
      case 'session_reset':
        // 服务器重启导致旧会话失效:换新 id,由外层自动重发一次
        sessionId = newSessionId();
        if (ctx) ctx.needsRetry = true;
        bubble.addNotice('会话已在服务端失效(服务器重启),已自动开启新会话并重发');
        bubble.finished = true;
        break;
      case 'error':
        bubble.showError(payload.message || '未知错误');
        bubble.finished = true;
        break;
    }
  }

  async function consumeSse(body, bubble, ctx) {
    var reader = body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    function drain() {
      var idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        handleFrame(buffer.slice(0, idx), bubble, ctx);
        buffer = buffer.slice(idx + 2);
      }
    }
    while (true) {
      var step = await reader.read();
      if (step.done) break;
      buffer += decoder.decode(step.value, { stream: true });
      drain();
    }
    buffer += decoder.decode(); // 流结束,flush 多字节残留
    drain();
    if (!bubble.finished) {
      bubble.finish();
      bubble.addNotice('连接中断,回复可能不完整');
    }
  }

  // 跑一轮;会话失效时返回 true(已换新会话 id),由调用方重发一次
  async function runTurn(message) {
    var bubble = appendAssistant();
    var ctx = { needsRetry: false };
    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: message })
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      await consumeSse(res.body, bubble, ctx);
    } catch (err) {
      bubble.showError(err.message || String(err));
    }
    return ctx.needsRetry;
  }

  formEl.addEventListener('submit', async function (e) {
    e.preventDefault();
    var message = inputEl.value.trim();
    if (!message || busy) return;
    busy = true; sendBtn.disabled = true;
    appendUser(message);
    inputEl.value = '';
    try {
      if (await runTurn(message)) {
        await runTurn(message); // 自动换新会话重发一次
      }
    } finally {
      busy = false; sendBtn.disabled = false; inputEl.focus();
    }
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); formEl.requestSubmit(); }
  });

  resetBtn.addEventListener('click', function () {
    sessionId = newSessionId();
    chatEl.innerHTML = '';
  });

  async function checkHealth() {
    try {
      var res = await fetch('/api/health');
      var data = await res.json();
      healthEl.textContent = '运行时: ' + (data.runtime_started ? '已启动' : '未启动(首问时启动)')
        + ' · ' + data.model;
    } catch (e) {
      healthEl.textContent = '运行时: 后端不可达';
    }
  }
  checkHealth();
})();
</script>
</body>
</html>
